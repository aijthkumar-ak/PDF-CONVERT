<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#7c3aed;
    --secondary:#2563eb;
    --bg:#080b18;
    --panel:rgba(18,23,45,.78);
    --text:#ffffff;
    --muted:#a7b0c5;
    --border:rgba(255,255,255,.10);
}

body.light{
    --bg:#eef2ff;
    --panel:rgba(255,255,255,.88);
    --text:#111827;
    --muted:#64748b;
    --border:rgba(0,0,0,.10);
}

/* BACKGROUND */

body{
    min-height:100vh;
    font-family:
    Inter,
    Arial,
    sans-serif;

    background:
    radial-gradient(circle at 10% 10%,
    rgba(124,58,237,.35),
    transparent 30%),

    radial-gradient(circle at 90% 20%,
    rgba(37,99,235,.30),
    transparent 30%),

    radial-gradient(circle at 50% 100%,
    rgba(236,72,153,.18),
    transparent 35%),

    var(--bg);

    color:var(--text);

    overflow-x:hidden;
}

/* FLOATING BACKGROUND */

body::before,
body::after{
    content:"";
    position:fixed;

    width:300px;
    height:300px;

    border-radius:50%;

    filter:blur(80px);

    opacity:.35;

    z-index:-1;

    animation:float 9s infinite alternate ease-in-out;
}

body::before{
    background:#7c3aed;
    top:5%;
    left:-100px;
}

body::after{
    background:#06b6d4;
    bottom:-100px;
    right:-80px;

    animation-delay:2s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,50px) scale(1.25);
    }
}

/* HEADER */

.header{
    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    background:var(--panel);

    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;

    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    font-size:22px;
    font-weight:800;
}

.logo-icon{
    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    box-shadow:
    0 8px 30px rgba(124,58,237,.4);

    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

.header-actions{
    display:flex;
    gap:10px;
}

/* BUTTON */

.btn{
    border:1px solid var(--border);

    background:rgba(255,255,255,.07);

    color:var(--text);

    padding:10px 15px;

    border-radius:11px;

    cursor:pointer;

    transition:.25s;

    font-weight:600;
}

.btn:hover{
    transform:translateY(-2px);

    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    box-shadow:
    0 8px 25px rgba(124,58,237,.3);
}

.btn-primary{
    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    border:none;
}

/* LAYOUT */

.app{
    display:grid;

    grid-template-columns:250px 1fr;

    min-height:calc(100vh - 76px);
}

/* SIDEBAR */

.sidebar{
    padding:20px 15px;

    background:var(--panel);

    backdrop-filter:blur(20px);

    border-right:1px solid var(--border);
}

.menu-title{
    color:var(--muted);

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1.5px;

    margin:10px 10px 12px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.menu button{
    width:100%;

    padding:13px;

    border:none;

    background:transparent;

    color:var(--text);

    text-align:left;

    border-radius:12px;

    cursor:pointer;

    transition:.25s;

    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:
    linear-gradient(90deg,
    rgba(124,58,237,.22),
    rgba(37,99,235,.12));

    transform:translateX(4px);
}

/* MAIN */

.main{
    padding:25px;

    min-width:0;
}

/* WELCOME */

.welcome{
    margin-bottom:20px;

    animation:slideDown .6s ease;
}

.welcome h1{
    font-size:30px;

    margin-bottom:5px;
}

.welcome p{
    color:var(--muted);
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* UPLOAD */

.upload{
    min-height:230px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    border:2px dashed rgba(124,58,237,.5);

    border-radius:22px;

    background:rgba(255,255,255,.04);

    cursor:pointer;

    transition:.3s;

    animation:fadeIn .8s ease;
}

.upload:hover{
    border-color:#8b5cf6;

    background:rgba(124,58,237,.08);

    transform:translateY(-3px);

    box-shadow:
    0 20px 50px rgba(0,0,0,.15);
}

.upload-icon{
    width:70px;
    height:70px;

    border-radius:20px;

    display:grid;
    place-items:center;

    font-size:30px;

    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    margin-bottom:15px;

    animation:bounce 2.5s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

.upload h2{
    margin-bottom:7px;
}

.upload p{
    color:var(--muted);
    font-size:13px;
}

#pdfInput{
    display:none;
}

/* EDITOR */

.editor{
    display:none;
}

.editor.show{
    display:block;

    animation:fadeIn .5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

/* TOOLBAR */

.toolbar{
    display:flex;

    flex-wrap:wrap;

    align-items:center;

    gap:8px;

    padding:12px;

    margin-bottom:18px;

    border-radius:16px;

    background:var(--panel);

    border:1px solid var(--border);

    backdrop-filter:blur(15px);
}

.tool{
    display:flex;

    align-items:center;

    gap:6px;

    padding:7px 10px;

    border-radius:9px;

    background:rgba(255,255,255,.06);

    color:var(--text);

    border:1px solid var(--border);
}

.tool input,
.tool select{
    background:transparent;

    color:var(--text);

    border:none;

    outline:none;

    width:70px;
}

.tool input[type=color]{
    width:35px;
    height:28px;
}

/* PDF AREA */

.pdf-wrapper{
    padding:30px;

    min-height:500px;

    display:flex;

    justify-content:center;

    overflow:auto;

    border-radius:20px;

    background:
    rgba(0,0,0,.20);

    border:1px solid var(--border);
}

#pdfArea{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:25px;
}

/* PAGE */

.page{
    position:relative;

    background:white;

    box-shadow:
    0 15px 50px rgba(0,0,0,.35);

    animation:pageIn .5s ease;

    transition:.3s;
}

.page:hover{
    box-shadow:
    0 20px 65px rgba(124,58,237,.25);
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:scale(.96) translateY(15px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.page canvas{
    display:block;
}

.textLayer{
    position:absolute;
    inset:0;
}

/* EDITABLE TEXT */

.editText{
    position:absolute;

    min-width:60px;

    padding:4px 7px;

    border:2px solid transparent;

    background:rgba(255,255,255,.85);

    color:#111;

    cursor:move;

    user-select:none;

    transition:.2s;

    border-radius:4px;

    outline:none;
}

.editText:hover{
    border-color:#8b5cf6;
}

.editText.selected{
    border-color:#2563eb;

    box-shadow:
    0 0 0 3px rgba(37,99,235,.15);
}

/* STATUS */

.status{
    padding:10px 0;

    color:var(--muted);

    font-size:13px;
}

/* MOBILE */

@media(max-width:800px){

    .app{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:none;
    }

    .main{
        padding:15px;
    }

    .header{
        padding:0 15px;
    }

    .logo{
        font-size:18px;
    }

    .header-actions .btn{
        padding:8px;
    }

    .welcome h1{
        font-size:24px;
    }

    .pdf-wrapper{
        padding:10px;
    }

}

</style>
</head>

<body>

<header class="header">

<div class="logo">
<div class="logo-icon">📄</div>
PDF Studio
</div>

<div class="header-actions">

<button class="btn" onclick="toggleTheme()">
🌙 Theme
</button>

<label class="btn btn-primary">
📂 Open PDF
<input type="file"
id="pdfInput"
accept="application/pdf">
</label>

</div>

</header>


<div class="app">

<aside class="sidebar">

<div class="menu-title">Editor</div>

<div class="menu">

<button class="active" onclick="showEditor()">
🏠 Dashboard
</button>

<button onclick="addText()">
✏️ Add Text
</button>

<button onclick="editSelected()">
📝 Edit Text
</button>

<button onclick="deleteSelected()">
🗑 Delete Text
</button>

</div>

<div class="menu-title">Tools</div>

<div class="menu">

<button onclick="zoomIn()">
🔍 Zoom In
</button>

<button onclick="zoomOut()">
🔎 Zoom Out
</button>

<button onclick="resetZoom()">
↩️ Reset Zoom
</button>

<button onclick="downloadPDF()">
📥 Download
</button>

</div>

</aside>


<main class="main">

<div class="welcome">

<h1>PDF Editor ✨</h1>

<p>Edit your PDF documents quickly and easily.</p>

</div>


<div id="uploadBox" class="upload"
onclick="document.getElementById('pdfInput').click()">

<div class="upload-icon">📄</div>

<h2>Drop your PDF here</h2>

<p>or click to browse your device</p>

</div>


<div id="editor" class="editor">

<div class="toolbar">

<button class="btn btn-primary"
onclick="addText()">
➕ Add Text
</button>

<button class="btn"
onclick="editSelected()">
✏️ Edit
</button>

<button class="btn"
onclick="deleteSelected()">
🗑 Delete
</button>


<div class="tool">

🔠

<input
type="number"
id="fontSize"
value="18"
min="6"
max="100">

</div>


<div class="tool">

🎨

<input
type="color"
id="fontColor"
value="#111111">

</div>


<div class="tool">

🔍

<button class="btn"
onclick="zoomOut()">−</button>

<span id="zoomValue">100%</span>

<button class="btn"
onclick="zoomIn()">+</button>

</div>


<button class="btn"
onclick="resetZoom()">
Reset
</button>


<button class="btn btn-primary"
onclick="downloadPDF()">
📥 Download
</button>

</div>


<div class="status" id="status">
Ready
</div>


<div class="pdf-wrapper">

<div id="pdfArea"></div>

</div>

</div>

</main>

</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDocument=null;

let pdfBytes=null;

let pages=[];

let objects=[];

let selected=null;

let zoom=1;


/* =========================
PDF UPLOAD
========================= */

document.getElementById("pdfInput")
.addEventListener("change",async function(){

    const file=this.files[0];

    if(!file)return;

    pdfBytes=await file.arrayBuffer();

    pdfDocument=
    await pdfjsLib.getDocument({
        data:pdfBytes.slice(0)
    }).promise;

    document.getElementById("uploadBox")
    .style.display="none";

    document.getElementById("editor")
    .classList.add("show");

    document.getElementById("pdfArea")
    .innerHTML="";

    pages=[];
    objects=[];
    selected=null;

    for(let i=1;i<=pdfDocument.numPages;i++){

        await renderPage(i);

    }

    status("PDF loaded successfully ✔");

});


/* =========================
RENDER
========================= */

async function renderPage(number){

    const page=
    await pdfDocument.getPage(number);

    const scale=1.5*zoom;

    const viewport=
    page.getViewport({
        scale:scale
    });

    const div=
    document.createElement("div");

    div.className="page";

    div.style.width=
    viewport.width+"px";

    div.style.height=
    viewport.height+"px";

    div.dataset.page=number;


    const canvas=
    document.createElement("canvas");

    canvas.width=
    viewport.width;

    canvas.height=
    viewport.height;


    div.appendChild(canvas);


    const layer=
    document.createElement("div");

    layer.className="textLayer";

    div.appendChild(layer);


    document.getElementById("pdfArea")
    .appendChild(div);


    await page.render({

        canvasContext:
        canvas.getContext("2d"),

        viewport:viewport

    }).promise;


    pages.push({

        number:number,

        div:div,

        scale:scale

    });

}


/* =========================
ADD TEXT
========================= */

function addText(){

    if(!pdfDocument){

        alert("First open a PDF.");

        return;

    }

    const page=pages[0];

    const el=
    document.createElement("div");

    el.className="editText";

    el.contentEditable=true;

    el.innerText="Edit this text";

    el.style.left="100px";

    el.style.top="100px";

    el.style.fontSize=
    document.getElementById("fontSize").value+"px";

    el.style.color=
    document.getElementById("fontColor").value;


    page.div
    .querySelector(".textLayer")
    .appendChild(el);


    const obj={

        page:1,

        element:el,

        x:100,

        y:100

    };


    objects.push(obj);

    selectText(el,obj);

    makeDraggable(el,obj);

    el.focus();

    status("New text added ✨");

}


/* =========================
SELECT
========================= */

function selectText(el,obj){

    el.addEventListener("click",function(e){

        e.stopPropagation();

        if(selected){

            selected.element
            .classList.remove("selected");

        }

        selected=obj;

        el.classList.add("selected");

        document.getElementById("fontSize")
        .value=parseInt(el.style.fontSize);

        document.getElementById("fontColor")
        .value=rgbToHex(el.style.color);

    });

}


/* =========================
EDIT
========================= */

function editSelected(){

    if(!selected){

        alert("First select a text.");

        return;

    }

    const el=selected.element;

    el.contentEditable=true;

    el.focus();

    const range=
    document.createRange();

    range.selectNodeContents(el);

    const selection=
    window.getSelection();

    selection.removeAllRanges();

    selection.addRange(range);

    status("Editing text ✏️");

}


/* =========================
DRAG
========================= */

function makeDraggable(el,obj){

    let dragging=false;

    let offsetX=0;

    let offsetY=0;


    el.addEventListener("mousedown",function(e){

        if(e.target===el){

            dragging=true;

            const rect=
            el.getBoundingClientRect();

            offsetX=
            e.clientX-rect.left;

            offsetY=
            e.clientY-rect.top;

            selectText(el,obj);

        }

    });


    document.addEventListener("mousemove",function(e){

        if(!dragging)return;

        const parent=
        el.parentElement.getBoundingClientRect();

        let x=
        e.clientX-parent.left-offsetX;

        let y=
        e.clientY-parent.top-offsetY;


        x=Math.max(0,x);

        y=Math.max(0,y);


        el.style.left=x+"px";

        el.style.top=y+"px";


        obj.x=x;

        obj.y=y;

    });


    document.addEventListener("mouseup",function(){

        dragging=false;

    });

}


/* =========================
DELETE
========================= */

function deleteSelected(){

    if(!selected){

        alert("Select text first.");

        return;

    }

    selected.element.remove();

    objects=
    objects.filter(
        x=>x!==selected
    );

    selected=null;

    status("Text deleted 🗑");

}


/* =========================
FONT
========================= */

document.getElementById("fontSize")
.addEventListener("input",function(){

    if(selected){

        selected.element.style.fontSize=
        this.value+"px";

    }

});


/* =========================
COLOR
========================= */

document.getElementById("fontColor")
.addEventListener("input",function(){

    if(selected){

        selected.element.style.color=
        this.value;

    }

});


/* =========================
ZOOM
========================= */

function zoomIn(){

    if(!pdfDocument)return;

    zoom+=.15;

    redraw();

}


function zoomOut(){

    if(!pdfDocument)return;

    zoom=Math.max(.5,zoom-.15);

    redraw();

}


function resetZoom(){

    zoom=1;

    redraw();

}


async function redraw(){

    const saved=[];

    objects.forEach(o=>{

        saved.push({

            page:o.page,

            text:o.element.innerText,

            x:o.element.style.left,

            y:o.element.style.top,

            size:o.element.style.fontSize,

            color:o.element.style.color

        });

    });


    document.getElementById("pdfArea")
    .innerHTML="";

    pages=[];

    objects=[];

    selected=null;


    for(let i=1;i<=pdfDocument.numPages;i++){

        await renderPage(i);

    }


    saved.forEach(o=>{

        const page=pages[o.page-1];

        const el=
        document.createElement("div");

        el.className="editText";

        el.contentEditable=true;

        el.innerText=o.text;

        el.style.left=o.x;

        el.style.top=o.y;

        el.style.fontSize=o.size;

        el.style.color=o.color;


        page.div
        .querySelector(".textLayer")
        .appendChild(el);


        const obj={
            page:o.page,
            element:el,
            x:parseFloat(o.x),
            y:parseFloat(o.y)
        };


        objects.push(obj);

        selectText(el,obj);

        makeDraggable(el,obj);

    });


    document.getElementById("zoomValue")
    .innerText=Math.round(zoom*100)+"%";

}


/* =========================
DOWNLOAD
========================= */

async function downloadPDF(){

    if(!pdfBytes){

        alert("Open a PDF first.");

        return;

    }


    const pdf=
    await PDFLib.PDFDocument.load(pdfBytes);


    const font=
    await pdf.embedFont(
        PDFLib.StandardFonts.Helvetica
    );


    const pdfPages=
    pdf.getPages();


    objects.forEach(obj=>{

        const page=
        pdfPages[obj.page-1];

        const info=
        pages[obj.page-1];

        const scale=info.scale;


        const el=obj.element;


        const x=
        parseFloat(el.style.left)/scale;


        const top=
        parseFloat(el.style.top)/scale;


        const size=
        parseFloat(el.style.fontSize)/scale;


        const y=
        page.getHeight()
        -top
        -size;


        page.drawText(
            el.innerText,
            {

                x:x,

                y:y,

                size:size,

                font:font,

                color:getColor(
                    el.style.color
                )

            }

        );

    });


    const result=
    await pdf.save();


    const blob=
    new Blob(
        [result],
        {type:"application/pdf"}
    );


    const url=
    URL.createObjectURL(blob);


    const a=
    document.createElement("a");

    a.href=url;

    a.download=
    "PDF-Studio-Edited.pdf";

    a.click();


    URL.revokeObjectURL(url);

    status("PDF downloaded successfully ✔");

}


/* =========================
COLOR
========================= */

function getColor(color){

    const hex=
    rgbToHex(color);

    const r=
    parseInt(hex.substring(1,3),16);

    const g=
    parseInt(hex.substring(3,5),16);

    const b=
    parseInt(hex.substring(5,7),16);


    return PDFLib.rgb(
        r/255,
        g/255,
        b/255
    );

}


function rgbToHex(color){

    if(color.startsWith("#"))
        return color;


    const rgb=
    color.match(/\d+/g);


    return "#"+
    [rgb[0],rgb[1],rgb[2]]
    .map(x=>
        parseInt(x)
        .toString(16)
        .padStart(2,"0")
    )
    .join("");

}


/* =========================
THEME
========================= */

function toggleTheme(){

    document.body
    .classList.toggle("light");

}


/* =========================
STATUS
========================= */

function status(message){

    document.getElementById("status")
    .innerText=message;

}


function showEditor(){

    if(pdfDocument){

        document.getElementById("editor")
        .classList.add("show");

    }

}

</script>

</body>
</html>
