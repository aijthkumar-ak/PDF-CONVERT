* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1f2937;
}

/* HEADER */

.header {
    height: 65px;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #60a5fa;
}

.header button {
    border: none;
    background: #2563eb;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.header button:hover {
    background: #1d4ed8;
}

/* MAIN */

.container {
    display: flex;
    height: calc(100vh - 65px);
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    background: white;
    border-right: 1px solid #ddd;
    padding: 20px;
}

.sidebar h3 {
    margin-bottom: 20px;
}

    border: none;

    background: #f3f4f6;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}
