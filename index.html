<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Order & Merge System</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f8;
}

.hidden {
    display: none !important;
}

/* LOGIN */

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 360px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 15px;
}

.login-btn {
    width: 100%;
    background: #1677ff;
    color: white;
    margin-top: 10px;
}

.error {
    color: red;
}

/* ADMIN */

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout {
    background: #dc3545;
    color: white;
}

/* ORDER */

.order-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.order-row {
    display: grid;
    grid-template-columns: 55px 1fr;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
}

.order-number {
    font-weight: bold;
    text-align: center;
    background: #1677ff;
    color: white;
    padding: 11px;
    border-radius: 7px;
}

.order-row input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.save-btn {
    background: #198754;
    color: white;
    margin-top: 10px;
}

/* PDF UPLOAD */

.upload-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.file-input {
    margin: 15px 0;
}

/* PDF LIST */

.pdf-list {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.pdf-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    margin: 8px 0;
    background: #f5f6f8;
    border-radius: 8px;
}

.pdf-name {
    font-weight: bold;
}

.matched {
    border-left: 5px solid #198754;
}

.not-matched {
    border-left: 5px solid #dc3545;
}

.merge-btn {
    width: 100%;
    background: #6f42c1;
    color: white;
    font-size: 17px;
    margin-top: 20px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

@media(max-width:600px) {

    .container {
        padding: 10px;
    }

    .header {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <h2>🔐 Admin Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>

        <p id="loginError" class="error"></p>

    </div>

</div>


<!-- ================= ADMIN PAGE ================= -->

<div id="adminPage" class="hidden">

<div class="container">

    <div class="header">

        <div>
            <h2>📄 PDF Order & Merge</h2>
            <small>Admin Panel</small>
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- ORDER SETTINGS -->

    <div class="order-box">

        <h3>🔢 PDF Order Settings</h3>

        <p>
            Enter the PDF names in the required order.
        </p>

        <div id="orderInputs"></div>

        <button
            class="save-btn"
            onclick="saveOrder()"
        >
            💾 Save Order
        </button>

        <p id="saveMessage"></p>

    </div>


    <!-- UPLOAD -->

    <div class="upload-box">

        <h3>📂 Upload PDF Files</h3>

        <p>
            Select your PDF files. Filename will be identified automatically.
        </p>

        <input
            class="file-input"
            type="file"
            id="pdfFiles"
            accept=".pdf"
            multiple
            onchange="processFiles()"
        >

    </div>


    <!-- PDF LIST -->

    <div class="pdf-list">

        <h3>📋 Detected PDF Order</h3>

        <div id="pdfList">
            No PDFs selected.
        </div>

        <button
            class="merge-btn"
            onclick="mergePDFs()"
        >
            🔀 Merge PDFs
        </button>

        <p
            id="mergeMessage"
            class="message"
        ></p>

    </div>

</div>

</div>


<script>

/* ==================================================
   LOGIN
================================================== */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (
        username === "admin" &&
        password === "1234"
    ) {

        localStorage.setItem(
            "pdf_logged_in",
            "true"
        );

        showAdmin();

    } else {

        document.getElementById(
            "loginError"
        ).innerText =
            "❌ Invalid username or password";

    }
}


function showAdmin() {

    document.getElementById(
        "loginPage"
    ).classList.add("hidden");

    document.getElementById(
        "adminPage"
    ).classList.remove("hidden");

    loadOrder();

    processFiles();
}


function logout() {

    localStorage.removeItem(
        "pdf_logged_in"
    );

    location.reload();
}


/* ==================================================
   CHECK LOGIN
================================================== */

window.onload = function() {

    if (
        localStorage.getItem(
            "pdf_logged_in"
        ) === "true"
    ) {

        showAdmin();

    }

};


/* ==================================================
   CREATE 10 ORDER INPUTS
================================================== */

function createOrderInputs(savedOrder = []) {

    const container =
        document.getElementById(
            "orderInputs"
        );

    container.innerHTML = "";

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const row =
            document.createElement("div");

        row.className =
            "order-row";

        const number =
            document.createElement("div");

        number.className =
            "order-number";

        number.innerText =
            i + 1;

        const input =
            document.createElement("input");

        input.type = "text";

        input.className =
            "order-name";

        input.placeholder =
            "Example: Layout";

        input.value =
            savedOrder[i] || "";

        row.appendChild(number);

        row.appendChild(input);

        container.appendChild(row);
    }
}


/* ==================================================
   SAVE ORDER
================================================== */

function saveOrder() {

    const inputs =
        document.querySelectorAll(
            ".order-name"
        );

    const order = [];

    inputs.forEach(input => {

        order.push(
            input.value.trim()
        );

    });

    localStorage.setItem(
        "pdf_order",
        JSON.stringify(order)
    );

    document.getElementById(
        "saveMessage"
    ).innerText =
        "✅ Order saved successfully!";

    processFiles();
}


/* ==================================================
   LOAD ORDER
================================================== */

function loadOrder() {

    const saved =
        localStorage.getItem(
            "pdf_order"
        );

    let order = [];

    if (saved) {

        try {

            order =
                JSON.parse(saved);

        } catch {

            order = [];

        }
    }

    createOrderInputs(order);
}


/* ==================================================
   GET ORDER
================================================== */

function getOrder() {

    const saved =
        localStorage.getItem(
            "pdf_order"
        );

    if (!saved) {
        return [];
    }

    try {

        return JSON.parse(saved);

    } catch {

        return [];

    }
}


/* ==================================================
   NORMALIZE PDF NAME
================================================== */

function normalizeName(name) {

    return name
        .toLowerCase()
        .replace(".pdf", "")
        .replace(/[^a-z0-9]/g, "");
}


/* ==================================================
   PROCESS PDF FILES
================================================== */

function processFiles() {

    const input =
        document.getElementById(
            "pdfFiles"
        );

    const list =
        document.getElementById(
            "pdfList"
        );

    if (!input || !list) {
        return;
    }

    const files =
        Array.from(input.files);

    if (files.length === 0) {

        list.innerHTML =
            "No PDFs selected.";

        return;
    }

    const order =
        getOrder()
        .filter(name => name.trim() !== "");

    const sorted = [];

    const used =
        new Set();


    /* MATCH ORDER WITH FILE NAME */

    order.forEach(
        orderName => {

            const target =
                normalizeName(
                    orderName
                );

            const index =
                files.findIndex(
                    file => {

                        if (
                            used.has(file)
                        ) {
                            return false;
                        }

                        const filename =
                            normalizeName(
                                file.name
                            );

                        return (
                            filename === target ||
                            filename.includes(target) ||
                            target.includes(filename)
                        );
                    }
                );

            if (index !== -1) {

                const file =
                    files[index];

                sorted.push({
                    file: file,
                    orderName: orderName,
                    matched: true
                });

                used.add(file);
            }

        }
    );


    /* ADD UNMATCHED FILES */

    files.forEach(file => {

        if (!used.has(file)) {

            sorted.push({
                file: file,
                orderName: "",
                matched: false
            });

        }

    });


    /* DISPLAY */

    list.innerHTML = "";

    sorted.forEach(
        (item, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "pdf-item " +
                (
                    item.matched
                    ? "matched"
                    : "not-matched"
                );

            const left =
                document.createElement(
                    "div"
                );

            left.className =
                "pdf-name";

            left.innerText =
                `${index + 1}. 📄 ${item.file.name}`;


            const right =
                document.createElement(
                    "div"
                );

            if (item.matched) {

                right.innerText =
                    "✅ Matched";

            } else {

                right.innerText =
                    "⚠️ Not matched";

            }

            div.appendChild(left);

            div.appendChild(right);

            list.appendChild(div);

        }
    );

}


/* ==================================================
   MERGE PDFs
================================================== */

async function mergePDFs() {

    const input =
        document.getElementById(
            "pdfFiles"
        );

    const message =
        document.getElementById(
            "mergeMessage"
        );

    const files =
        Array.from(input.files);

    if (files.length === 0) {

        message.innerText =
            "⚠️ Please select PDF files.";

        return;
    }


    const order =
        getOrder()
        .filter(name => name.trim() !== "");


    /* BUILD SORTED FILE LIST */

    const sortedFiles = [];

    const used =
        new Set();


    order.forEach(
        orderName => {

            const target =
                normalizeName(
                    orderName
                );

            const file =
                files.find(
                    file => {

                        if (
                            used.has(file)
                        ) {
                            return false;
                        }

                        const filename =
                            normalizeName(
                                file.name
                            );

                        return (
                            filename === target ||
                            filename.includes(target) ||
                            target.includes(filename)
                        );

                    }
                );

            if (file) {

                sortedFiles.push(file);

                used.add(file);

            }

        }
    );


    /* UNMATCHED FILES AT END */

    files.forEach(file => {

        if (!used.has(file)) {

            sortedFiles.push(file);

        }

    });


    message.innerText =
        "⏳ Merging PDFs...";


    try {

        const mergedPDF =
            await PDFLib.PDFDocument.create();


        for (
            const file of sortedFiles
        ) {

            const data =
                await file.arrayBuffer();

            const pdf =
                await PDFLib.PDFDocument.load(
                    data
                );

            const pages =
                await mergedPDF.copyPages(
                    pdf,
                    pdf.getPageIndices()
                );


            pages.forEach(page => {

                mergedPDF.addPage(page);

            });

        }


        const pdfBytes =
            await mergedPDF.save();


        const blob =
            new Blob(
                [pdfBytes],
                {
                    type:
                        "application/pdf"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement(
                "a"
            );

        link.href =
            url;

        link.download =
            "Merged_PDF.pdf";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);


        message.innerText =
            "✅ PDF merged successfully!";

    }

    catch(error) {

        console.error(error);

        message.innerText =
            "❌ Error while merging PDFs.";

    }

}

</script>

</body>
</html>
