<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PDF Studio Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#070b18;
 --card:rgba(20,27,50,.82);
 --card2:rgba(255,255,255,.06);
 --text:#fff;
 --muted:#aab3c7;
 --border:rgba(255,255,255,.12);
 --primary:#7c3aed;
 --blue:#2563eb;
}

body.light{
 --bg:#eef2ff;
 --card:rgba(255,255,255,.9);
 --card2:rgba(0,0,0,.05);
 --text:#111827;
 --muted:#64748b;
 --border:rgba(0,0,0,.12);
}

body{
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:var(--text);
 background:
 radial-gradient(circle at 10% 15%,#5421a355,transparent 30%),
 radial-gradient(circle at 90% 20%,#1769d855,transparent 30%),
 radial-gradient(circle at 50% 100%,#db277755,transparent 30%),
 var(--bg);
 overflow-x:hidden;
}

/* animated background */

body:before,
body:after{
 content:"";
 position:fixed;
 width:300px;
 height:300px;
 border-radius:50%;
 filter:blur(80px);
 opacity:.3;
 z-index:-1;
 animation:float 9s ease-in-out infinite alternate;
}

body:before{
 background:#7c3aed;
 left:-100px;
 top:100px;
}

body:after{
 background:#06b6d4;
 right:-100px;
 bottom:-80px;
 animation-delay:2s;
}

@keyframes float{
 from{transform:translate(0,0) scale(1)}
 to{transform:translate(80px,50px) scale(1.2)}
}

/* HEADER */

header{
 height:72px;
 padding:0 22px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:var(--card);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:100;
}

.logo{
 display:flex;
 align-items:center;
 gap:12px;
 font-size:21px;
 font-weight:bold;
}

.logoIcon{
 width:43px;
 height:43px;
 border-radius:13px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,var(--primary),var(--blue));
 box-shadow:0 8px 30px #7c3aed66;
 animation:pulse 2.5s infinite;
}

@keyframes pulse{
 50%{transform:scale(1.08)}
}

/* BUTTONS */

button,.openBtn{
 border:1px solid var(--border);
 color:var(--text);
 background:var(--card2);
 padding:10px 14px;
 border-radius:10px;
 cursor:pointer;
 font-weight:600;
 transition:.25s;
}

button:hover,.openBtn:hover{
 transform:translateY(-2px);
 background:linear-gradient(135deg,var(--primary),var(--blue));
 box-shadow:0 8px 25px #0003;
}

.primary{
 background:linear-gradient(135deg,var(--primary),var(--blue));
 border:0;
}

.green{
 background:linear-gradient(135deg,#059669,#16a34a);
 border:0;
}

#fileInput{
 display:none;
}

/* LAYOUT */

.layout{
 display:grid;
 grid-template-columns:235px 1fr;
 min-height:calc(100vh - 72px);
}

.sidebar{
 padding:20px 14px;
 background:var(--card);
 backdrop-filter:blur(20px);
 border-right:1px solid var(--border);
}

.title{
 color:var(--muted);
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1.5px;
 margin:10px;
}

.menu{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.menu button{
 text-align:left;
 width:100%;
 background:transparent;
 border:0;
}

.menu button:hover{
 transform:translateX(4px);
}

/* MAIN */

main{
 padding:25px;
 min-width:0;
}

.heading{
 margin-bottom:20px;
 animation:down .6s ease;
}

.heading h1{
 font-size:30px;
 margin-bottom:5px;
}

.heading p{
 color:var(--muted);
}

@keyframes down{
 from{opacity:0;transform:translateY(-15px)}
 to{opacity:1;transform:translateY(0)}
}

/* UPLOAD */

.upload{
 min-height:280px;
 border:2px dashed #8b5cf688;
 border-radius:24px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 cursor:pointer;
 background:#ffffff06;
 transition:.3s;
}

.upload:hover{
 transform:translateY(-4px);
 background:#7c3aed14;
 border-color:#a78bfa;
 box-shadow:0 25px 60px #0003;
}

.uploadIcon{
 width:75px;
 height:75px;
 border-radius:22px;
 display:grid;
 place-items:center;
 font-size:32px;
 background:linear-gradient(135deg,var(--primary),var(--blue));
 margin-bottom:18px;
 animation:bounce 2s infinite;
}

@keyframes bounce{
 50%{transform:translateY(-9px)}
}

.upload h2{
 margin-bottom:7px;
}

.upload p{
 color:var(--muted);
 font-size:13px;
}

/* EDITOR */

.editor{
 display:none;
}

.editor.show{
 display:block;
 animation:fade .5s ease;
}

@keyframes fade{
 from{opacity:0}
 to{opacity:1}
}

/* TOOLBAR */

.toolbar{
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:8px;
 padding:12px;
 margin-bottom:15px;
 background:var(--card);
 border:1px solid var(--border);
 border-radius:17px;
 backdrop-filter:blur(15px);
}

.control{
 display:flex;
 align-items:center;
 gap:6px;
 background:var(--card2);
 border:1px solid var(--border);
 border-radius:9px;
 padding:6px 9px;
}

.control input{
 width:65px;
 background:transparent;
 color:var(--text);
 border:0;
 outline:0;
}

.control input[type=color]{
 width:34px;
 height:28px;
 padding:0;
}

.status{
 color:var(--muted);
 font-size:13px;
 margin:8px 0 14px;
}

/* PDF */

.pdfBox{
 min-height:500px;
 overflow:auto;
 padding:30px;
 border-radius:20px;
 background:#0004;
 border:1px solid var(--border);
}

#pdfArea{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:28px;
}

.page{
 position:relative;
 background:white;
 box-shadow:0 15px 50px #0006;
 animation:pageIn .45s ease;
}

@keyframes pageIn{
 from{opacity:0;transform:scale(.96) translateY(12px)}
 to{opacity:1;transform:scale(1) translateY(0)}
}

.page canvas{
 display:block;
}

.textLayer{
 position:absolute;
 inset:0;
}

/* PDF TEXT */

.pdfText{
 position:absolute;
 white-space:pre;
 cursor:text;
 color:#111;
 border:1px solid transparent;
 padding:1px 2px;
 line-height:1;
 transform-origin:left top;
}

.pdfText:hover{
 border-color:#8b5cf6;
 background:#8b5cf611;
}

.pdfText.selected{
 border:2px solid #2563eb;
 background:#2563eb18;
 box-shadow:0 0 0 3px #2563eb22;
}

.pdfText.editing{
 background:#fff;
 color:#111;
 border:2px solid #7c3aed;
 outline:none;
}

/* responsive */

@media(max-width:800px){
 .layout{grid-template-columns:1fr}
 .sidebar{display:none}
 main{padding:15px}
 .heading h1{font-size:24px}
 .pdfBox{padding:10px}
}
</style>
</head>

<body>

<header>

<div class="logo">
 <div class="logoIcon">📄</div>
 PDF Studio
</div>

<div>
 <button onclick="toggleTheme()">🌙 Theme</button>

 <label class="openBtn primary">
  📂 Open PDF
  <input id="fileInput" type="file" accept="application/pdf">
 </label>
</div>

</header>


<div class="layout">

<aside class="sidebar">

<div class="title">Editor</div>

<div class="menu">

<button onclick="addText()">➕ Add Text</button>

<button onclick="startEdit()">✏️ Edit Text</button>

<button onclick="deleteSelected()">🗑 Delete</button>

</div>

<div class="title">View</div>

<div class="menu">

<button onclick="zoomIn()">🔍 Zoom In</button>

<button onclick="zoomOut()">🔎 Zoom Out</button>

<button onclick="resetZoom()">↩️ Reset Zoom</button>

</div>

<div class="title">File</div>

<div class="menu">

<button onclick="downloadPDF()">📥 Download PDF</button>

<button onclick="newPDF()">📄 New PDF</button>

</div>

</aside>


<main>

<div class="heading">
<h1>PDF Editor ✨</h1>
<p>Edit text directly on your PDF and download the result.</p>
</div>


<div id="upload" class="upload"
onclick="document.getElementById('fileInput').click()">

<div class="uploadIcon">📄</div>

<h2>Upload your PDF</h2>

<p>Click here to select a PDF file</p>

</div>


<div id="editor" class="editor">

<div class="toolbar">

<button class="primary" onclick="addText()">
➕ Add Text
</button>

<button onclick="startEdit()">
✏️ Edit
</button>

<button onclick="deleteSelected()">
🗑 Delete
</button>

<div class="control">
🔠
<input id="fontSize"
type="number"
value="16"
min="6"
max="100">
</div>

<div class="control">
🎨
<input id="fontColor"
type="color"
value="#111111">
</div>

<button onclick="zoomOut()">−</button>

<span id="zoomValue">100%</span>

<button onclick="zoomIn()">+</button>

<button onclick="resetZoom()">Reset</button>

<button class="green"
onclick="downloadPDF()">
📥 Download
</button>

</div>

<div id="status" class="status">
Ready
</div>

<div class="pdfBox">
<div id="pdfArea"></div>
</div>

</div>

</main>

</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDocument=null;
let originalBytes=null;

let pages=[];
let textObjects=[];

let selected=null;

let zoom=1;


/* ==========================
   OPEN PDF
========================== */

document.getElementById("fileInput")
.addEventListener("change",async function(){

 const file=this.files[0];

 if(!file)return;

 originalBytes=
 await file.arrayBuffer();

 pdfDocument=
 await pdfjsLib.getDocument({
   data:originalBytes.slice(0)
 }).promise;

 document.getElementById("upload").style.display="none";

 document.getElementById("editor")
 .classList.add("show");

 await buildPDF();

 setStatus(
 "PDF loaded ✔ Click any text to select it."
 );

});


/* ==========================
   BUILD PDF
========================== */

async function buildPDF(){

 pages=[];
 textObjects=[];

 selected=null;

 document.getElementById("pdfArea")
 .innerHTML="";

 for(let i=1;i<=pdfDocument.numPages;i++){

   await renderPage(i);

 }

}


/* ==========================
   RENDER PAGE
========================== */

async function renderPage(pageNumber){

 const pdfPage=
 await pdfDocument.getPage(pageNumber);

 const scale=1.5*zoom;

 const viewport=
 pdfPage.getViewport({
   scale:scale
 });


 const pageDiv=
 document.createElement("div");

 pageDiv.className="page";

 pageDiv.style.width=
 viewport.width+"px";

 pageDiv.style.height=
 viewport.height+"px";


 const canvas=
 document.createElement("canvas");

 canvas.width=viewport.width;
 canvas.height=viewport.height;


 pageDiv.appendChild(canvas);


 const layer=
 document.createElement("div");

 layer.className="textLayer";

 pageDiv.appendChild(layer);


 document.getElementById("pdfArea")
 .appendChild(pageDiv);


 await pdfPage.render({
   canvasContext:canvas.getContext("2d"),
   viewport:viewport
 }).promise;


 /*
   GET EXISTING PDF TEXT
 */

 const content=
 await pdfPage.getTextContent();


 content.items.forEach(item=>{

   if(!item.str.trim())return;

   const tx=
   pdfjsLib.Util.transform(
     viewport.transform,
     item.transform
   );


   const x=tx[4];

   const y=tx[5];


   const fontHeight=
   Math.sqrt(
     tx[2]*tx[2]+
     tx[3]*tx[3]
   );


   const el=
   document.createElement("div");

   el.className="pdfText";

   el.innerText=item.str;

   el.style.left=x+"px";

   el.style.top=
   (y-fontHeight)+"px";

   el.style.fontSize=
   fontHeight+"px";


   /*
     Approximate width
   */

   if(item.width){
     el.style.minWidth=
     item.width*scale+"px";
   }


   layer.appendChild(el);


   const obj={

     page:pageNumber,

     element:el,

     original:true,

     originalText:item.str,

     x:x,

     y:y-fontHeight,

     width:item.width*scale || 100,

     height:fontHeight,

     deleted:false,

     changed:false

   };


   textObjects.push(obj);


   selectObject(el,obj);


   makeDraggable(el,obj);


   /*
     DOUBLE CLICK EDIT
   */

   el.ondblclick=function(e){

     e.stopPropagation();

     selectObject(el,obj);

     startEdit();

   };

 });


 pages.push({

   number:pageNumber,

   div:pageDiv,

   scale:scale

 });

}


/* ==========================
   SELECT TEXT
========================== */

function selectObject(el,obj){

 el.onclick=function(e){

   e.stopPropagation();

   if(selected){
     selected.element
     .classList.remove("selected");
   }

   selected=obj;

   el.classList.add("selected");

   document.getElementById("fontSize")
   .value=parseInt(
     el.style.fontSize
   ) || 16;

   setStatus(
     "Text selected ✏️ Press Edit or double-click."
   );

 };

}


/* ==========================
   EDIT
========================== */

function startEdit(){

 if(!selected){

   setStatus(
     "Please click a PDF text first."
   );

   return;
 }


 const el=selected.element;

 el.contentEditable="true";

 el.classList.add("editing");

 el.focus();


 const range=
 document.createRange();

 range.selectNodeContents(el);

 const sel=
 window.getSelection();

 sel.removeAllRanges();

 sel.addRange(range);


 setStatus(
 "Editing... Type your new text and click outside."
 );


 el.onblur=function(){

   el.contentEditable="false";

   el.classList.remove("editing");

   selected.changed=true;

   selected.newText=el.innerText;

   setStatus("Text updated ✔");

 };

}


/* ==========================
   ADD TEXT
========================== */

function addText(){

 if(!pdfDocument){

   alert("Please upload a PDF first.");

   return;
 }


 const page=pages[0];

 const el=
 document.createElement("div");

 el.className="pdfText selected";

 el.contentEditable="true";

 el.innerText="New Text";

 el.style.left="100px";

 el.style.top="100px";

 el.style.fontSize=
 document.getElementById("fontSize").value+"px";

 el.style.color=
 document.getElementById("fontColor").value;


 page.div
 .querySelector(".textLayer")
 .appendChild(el);


 const obj={

   page:1,

   element:el,

   original:false,

   x:100,

   y:100,

   width:120,

   height:25,

   deleted:false,

   changed:true,

   newText:"New Text"

 };


 textObjects.push(obj);

 selected=obj;

 makeDraggable(el,obj);

 el.focus();


 setStatus(
 "New text added. Type your text ✨"
 );

}


/* ==========================
   DELETE
========================== */

function deleteSelected(){

 if(!selected){

   setStatus(
     "Select a text first."
   );

   return;
 }


 selected.deleted=true;

 selected.element.remove();

 setStatus(
   "Text deleted 🗑"
 );

 selected=null;

}


/* ==========================
   DRAG
========================== */

function makeDraggable(el,obj){

 let dragging=false;

 let ox=0;

 let oy=0;


 el.addEventListener(
 "mousedown",
 function(e){

   if(el.contentEditable==="true")
     return;

   dragging=true;

   const r=
   el.getBoundingClientRect();

   ox=e.clientX-r.left;

   oy=e.clientY-r.top;

   selectObject(el,obj);

 });


 document.addEventListener(
 "mousemove",
 function(e){

   if(!dragging)return;

   const parent=
   el.parentElement
   .getBoundingClientRect();

   let x=
   e.clientX-parent.left-ox;

   let y=
   e.clientY-parent.top-oy;


   x=Math.max(0,x);

   y=Math.max(0,y);


   el.style.left=x+"px";

   el.style.top=y+"px";


   obj.x=x;

   obj.y=y;

   obj.changed=true;

 });


 document.addEventListener(
 "mouseup",
 function(){

   dragging=false;

 });

}


/* ==========================
   FONT SIZE
========================== */

document.getElementById("fontSize")
.addEventListener("input",function(){

 if(!selected)return;

 selected.element.style.fontSize=
 this.value+"px";

 selected.changed=true;

});


/* ==========================
   COLOR
========================== */

document.getElementById("fontColor")
.addEventListener("input",function(){

 if(!selected)return;

 selected.element.style.color=
 this.value;

 selected.changed=true;

});


/* ==========================
   ZOOM
========================== */

async function zoomIn(){

 if(!pdfDocument)return;

 zoom+=.15;

 await rebuildKeepingEdits();

}


async function zoomOut(){

 if(!pdfDocument)return;

 zoom=Math.max(.5,zoom-.15);

 await rebuildKeepingEdits();

}


async function resetZoom(){

 zoom=1;

 await rebuildKeepingEdits();

}


async function rebuildKeepingEdits(){

 /*
   Save user edits
 */

 const saved=textObjects
 .filter(o=>o.changed && !o.deleted)
 .map(o=>({

   page:o.page,

   text:o.element.innerText,

   x:o.x,

   y:o.y,

   size:o.element.style.fontSize,

   color:o.element.style.color

 }));


 document.getElementById("pdfArea")
 .innerHTML="";

 pages=[];

 textObjects=[];

 selected=null;


 for(let i=1;i<=pdfDocument.numPages;i++){

   await renderPage(i);

 }


 /*
   Restore changed text
 */

 saved.forEach(s=>{

   const page=pages[s.page-1];

   const el=
   document.createElement("div");

   el.className="pdfText";

   el.innerText=s.text;

   el.style.left=s.x+"px";

   el.style.top=s.y+"px";

   el.style.fontSize=s.size;

   el.style.color=s.color;


   page.div
   .querySelector(".textLayer")
   .appendChild(el);


   const obj={

     page:s.page,

     element:el,

     original:false,

     changed:true,

     deleted:false,

     x:s.x,

     y:s.y

   };


   textObjects.push(obj);

   selectObject(el,obj);

   makeDraggable(el,obj);

 });


 document.getElementById("zoomValue")
 .innerText=
 Math.round(zoom*100)+"%";

}


/* ==========================
   DOWNLOAD
========================== */

async function downloadPDF(){

 if(!originalBytes){

   alert("Upload a PDF first.");

   return;
 }


 const pdf=
 await PDFLib.PDFDocument.load(
   originalBytes.slice(0)
 );


 const font=
 await pdf.embedFont(
   PDFLib.StandardFonts.Helvetica
 );


 const pdfPages=
 pdf.getPages();


 /*
   Draw changes
 */

 textObjects.forEach(obj=>{

   if(!obj.changed && !obj.deleted)
     return;


   const page=
   pdfPages[obj.page-1];

   const info=
   pages[obj.page-1];

   const scale=info.scale;

   const el=obj.element;


   /*
     Position
   */

   const x=
   parseFloat(el.style.left)/scale;


   const top=
   parseFloat(el.style.top)/scale;


   const size=
   parseFloat(
     el.style.fontSize || "16"
   )/scale;


   const text=
   el.innerText;


   /*
     Cover old text
   */

   if(obj.original){

     const width=
     (obj.width || 100)/scale;


     const height=
     (obj.height || size)/scale;


     page.drawRectangle({

       x:x-2,

       y:
       page.getHeight()
       -top
       -height
       -2,

       width:width+5,

       height:height+5,

       color:PDFLib.rgb(
         1,1,1
       )

     });

   }


   /*
     Delete = only cover old text
   */

   if(obj.deleted){

     if(obj.original){

       page.drawRectangle({

         x:x-2,

         y:
         page.getHeight()
         -top
         -size
         -2,

         width:
         (obj.width||100)/scale+5,

         height:
         size+5,

         color:PDFLib.rgb(1,1,1)

       });

     }

     return;

   }


   /*
     New text
   */

   page.drawText(text,{

     x:x,

     y:
     page.getHeight()
     -top
     -size,

     size:size,

     font:font,

     color:getPDFColor(
       el.style.color
     )

   });

 });


 const result=
 await pdf.save();


 const blob=
 new Blob(
   [result],
   {type:"application/pdf"}
 );


 const url=
 URL.createObjectURL(blob);


 const a=
 document.createElement("a");

 a.href=url;

 a.download=
 "Edited-PDF.pdf";

 a.click();


 URL.revokeObjectURL(url);


 setStatus(
   "Edited PDF downloaded ✔"
 );

}


/* ==========================
   COLOR
========================== */

function getPDFColor(color){

 let rgb;


 if(color.startsWith("#")){

   const hex=color.substring(1);

   rgb=[
     parseInt(hex.substring(0,2),16),
     parseInt(hex.substring(2,4),16),
     parseInt(hex.substring(4,6),16)
   ];

 }else{

   rgb=color.match(/\d+/g);

 }


 return PDFLib.rgb(
   Number(rgb[0])/255,
   Number(rgb[1])/255,
   Number(rgb[2])/255
 );

}


/* ==========================
   THEME
========================== */

function toggleTheme(){

 document.body
 .classList.toggle("light");

}


/* ==========================
   NEW PDF
========================== */

function newPDF(){

 location.reload();

}


/* ==========================
   STATUS
========================== */

function setStatus(message){

 document.getElementById("status")
 .innerText=message;

}

</script>

</body>
</html>
